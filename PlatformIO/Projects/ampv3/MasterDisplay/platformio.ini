[env:pico2_arm]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; Reserves flash space for LittleFS (the settings file is under 1 KB).
board_build.filesystem_size = 64k
build_flags =
    -O3
    -Wl,--gc-sections

lib_deps = 
    moononournation/GFX Library for Arduino@^1.6.7
    z3t0/IRremote @ ^4.4.1

[env:pico2_riscv]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.mcu = rp2350-riscv
; Reserves flash space for LittleFS (the settings file is under 1 KB).
board_build.filesystem_size = 64k
build_flags =
    -O3
    -Wl,--gc-sections

lib_deps = 
    moononournation/GFX Library for Arduino@^1.6.7
    z3t0/IRremote @ ^4.4.1    