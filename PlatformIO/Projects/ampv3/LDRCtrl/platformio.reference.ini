; Driver-board bring-up test — RP2040, Earle Philhower Arduino core
; Controller board holds the 4-channel LED driver stage; two LDR boards
; (one per audio channel) connect via i2c0/i2c1. No UART0 link to the
; master board, no calibration, no ADS1115 read yet -- USB CDC serial only.

[platformio]
; Pico W is now the primary target (see note on [env:picow] below) --
; plain `pio run` / `pio run -t upload` now targets it without needing
; -e. [env:pico] is kept only in case the original board's MCU ever gets
; replaced and pressed back into service.
default_envs = picow

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Reserves flash space for LittleFS -- without this, the board has zero
; bytes allocated for a filesystem, so both mount and format fail. Our
; saved calibrations are a few KB total; this leaves generous headroom.
board_build.filesystem_size = 64k

; Now the primary target: moving to a spare Pico W rather than continue
; chasing the original board's I2C fault. Worth noting honestly -- the
; last real evidence (swapping cables, not chips, fixed the Pico W test)
; pointed more toward bad jumper wires than a damaged original MCU, so
; this is a pragmatic move forward, not a confirmed chip-failure verdict.
; GPIO23/25 are
; repurposed on Pico W for the onboard wireless chip's own SPI-like
; interface (23 = wireless power-on, 25 = wireless SPI chip-select) --
; this project's REGULATOR_MODE_PIN=23 and DIAGNOSTIC_LED_PIN=25 would
; collide with that. LDR_BOARD_IS_PICO_W is OUR OWN flag (not a core-
; internal one we'd have to guess at) that Board.cpp checks to skip both
; pins entirely on this environment -- see Board.cpp.
[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
board_build.filesystem_size = 64k
build_flags = -D LDR_BOARD_IS_PICO_W
