; LDR daughter board firmware -- RP2040 (Pico W), Earle Philhower Arduino core.
; Driver board v1b: four-channel LED driver on an aluminium block (NTC + TL431 + DS18B20),
; two LDR boards on i2c0/i2c1, UART link to the master board.

[platformio]
default_envs = picow

; On Pico W, GPIO23/25 belong to the wireless chip (power-on / SPI chip-select). Our own
; LDR_BOARD_IS_PICO_W flag makes the firmware reach the SMPS power-save pin and the LED
; through the wireless chip's GPIO instead (see Pins.hpp / Board.cpp).
[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Reserves flash space for LittleFS (the saved calibrations are a few KB).
board_build.filesystem_size = 64k
build_flags = -D LDR_BOARD_IS_PICO_W
