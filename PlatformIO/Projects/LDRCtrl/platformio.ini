; Driver-board bring-up test — RP2040, Earle Philhower Arduino core
; Controller board holds the 4-channel LED driver stage; two LDR boards
; (one per audio channel) connect via i2c0/i2c1. No UART0 link to the
; master board, no calibration, no ADS1115 read yet -- USB CDC serial only.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Reserves flash space for LittleFS -- without this, the board has zero
; bytes allocated for a filesystem, so both mount and format fail. Our
; saved calibrations are a few KB total; this leaves generous headroom.
board_build.filesystem_size = 64k